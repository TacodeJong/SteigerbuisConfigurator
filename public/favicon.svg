<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Steigerbuis kniestuk">
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a96a3"/>
      <stop offset="0.45" stop-color="#a8b4c0"/>
      <stop offset="1" stop-color="#6e7a88"/>
    </linearGradient>
    <linearGradient id="elbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <!-- Zelfde hemel als 3D-preview -->
  <rect width="32" height="32" rx="7" fill="#c5dce8"/>

  <!-- Kniestuk: dikke donkere bocht -->
  <path
    d="M 14.5 27
       L 14.5 16.5
       Q 14.5 11.5 19.5 11.5
       L 27 11.5"
    fill="none"
    stroke="url(#elbow)"
    stroke-width="9.5"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- Licht op buitenkant bocht -->
  <path
    d="M 14.5 17.5
       Q 14.5 13 18.5 11.8"
    fill="none"
    stroke="#fff"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.38"
  />

  <!-- Buizen (dunner, lichter — steken in kniestuk) -->
  <line x1="14.5" y1="27" x2="14.5" y2="19" stroke="url(#pipe)" stroke-width="5.5" stroke-linecap="butt"/>
  <line x1="22" y1="11.5" x2="27" y2="11.5" stroke="url(#pipe)" stroke-width="5.5" stroke-linecap="butt"/>

  <!-- Klemringen aan buiseinden -->
  <ellipse cx="14.5" cy="18.6" rx="3.6" ry="1.1" fill="none" stroke="#1a1a1a" stroke-width="0.9" opacity="0.7"/>
  <ellipse cx="21.2" cy="11.5" rx="1.1" ry="3.6" fill="none" stroke="#1a1a1a" stroke-width="0.9" opacity="0.7"/>
</svg>
